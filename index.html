<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PureDevn Studio</title>
  <meta name="description" content="PureDevn Studio, Ebikon. Printatops: Ausmalbilder zum Ausdrucken.">
  <link rel="canonical" href="https://mrdevn4ever-sys.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16202A;
      --muted: #5A6B78;
      --paper: #FFFFFF;
      --surface: #F0F3F5;
      --rule: #D9E1E6;
      --accent: #2C6E7F;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.55;
    }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .page {
      max-width: 40rem;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--paper);
      padding: clamp(2rem, 6vw, 4.5rem) clamp(1.25rem, 5vw, 3.25rem) 3.5rem;
      box-shadow: 0 0 0 1px var(--rule);
    }
    .eyebrow {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.7rem;
    }
    h1 {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 7vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 0.85rem;
    }
    .where {
      margin: 0 0 2.75rem;
      color: var(--muted);
    }
    h2 {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      margin: 0 0 0.45rem;
    }
    .app {
      padding: 1.35rem 0 1.6rem;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--rule);
    }
    .app p { margin: 0 0 0.85rem; }
    .pkg {
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.35rem;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-weight: 500;
    }
    address {
      font-style: normal;
      margin: 2.25rem 0 0;
    }
    address p { margin: 0 0 0.2rem; }
    footer {
      margin-top: 3rem;
      padding-top: 1.15rem;
      border-top: 2px solid var(--ink);
      font-size: 0.92rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Einzelunternehmen</p>
    <h1>PureDevn Studio</h1>
    <p class="where">Ebikon, Schweiz</p>

    <section class="app" aria-labelledby="app-name">
      <h2 id="app-name">Printatops</h2>
      <p>Ausmalbilder zum Ausdrucken. Android-App, ohne Konto.</p>
      <p class="pkg">com.puredevn.printatops</p>
      <nav class="links" aria-label="Printatops">
        <a href="https://mrdevn4ever-sys.github.io/printatops-privacy/">Datenschutz &amp; Impressum</a>
      </nav>
    </section>

    <address>
      <h2>Kontakt</h2>
      <p>Michael Spiess</p>
      <p>Riedmattstrasse 1</p>
      <p>6030 Ebikon</p>
      <p><a href="mailto:puredevn.io@gmail.com">puredevn.io@gmail.com</a></p>
    </address>

    <footer>
      <a href="/app-ads.txt">app-ads.txt</a>
    </footer>
  </main>
</body>
</html>
